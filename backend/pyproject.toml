[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-healthcare-research-backend"
version = "0.1.0"
description = "Research implementation of privacy-preserving federated learning for healthcare"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pg8000>=1.30,<2.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.7,<3.0",
    "numpy>=2.1,<3.0",
    "scikit-learn>=1.6,<2.0",
    "pandas>=2.2,<4.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
